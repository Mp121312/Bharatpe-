<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>BharatPe Payments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary:#6C5CE7; --primary-dark:#5A4BD1; --primary-light:#EDE9FE; --success:#00B894; --text:#2D3436; --bg:#F8F9FA; --card:#fff; --radius:16px; --shadow:0 8px 20px rgba(0,0,0,0.06); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:20px 14px; }
.container { max-width:600px; margin:auto; }
.top-bar { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
.top-bar h1 { font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,var(--primary),#A29BFE); -webkit-background-clip:text; -webkit-text-fill-color:transparent; flex:1; }
.icon-btn { width:44px; height:44px; border-radius:12px; background:white; border:1.5px solid #e0e0e0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.2rem; box-shadow:var(--shadow); }
.filter-panel { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:20px; display:none; animation:slideDown .25s ease; }
.filter-panel.show { display:block; }
@keyframes slideDown { from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }
.filter-row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.filter-row label { font-size:0.7rem; font-weight:700; color:#636E72; text-transform:uppercase; display:block; margin-bottom:4px; }
.filter-row input, .filter-row select { flex:1; min-width:120px; padding:10px; border:1px solid #e0e0e0; border-radius:8px; }
.apply-btn { padding:10px 20px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
.total-card { background:linear-gradient(135deg,#6C5CE7,#8B7CF6); color:white; border-radius:var(--radius); padding:20px; margin-bottom:20px; }
.total-amount { font-size:2rem; font-weight:800; }
.txn-list { display:flex; flex-direction:column; gap:10px; }
.txn-card { background:white; border-radius:10px; padding:14px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
.avatar { width:40px; height:40px; border-radius:50%; background:#EDE9FE; display:flex; align-items:center; justify-content:center; font-weight:700; color:#6C5CE7; }
.txn-details { flex:1; }
.txn-name { font-weight:600; font-size:0.9rem; }
.txn-meta { font-size:0.7rem; color:#636E72; }
.txn-amount { font-weight:700; color:#00B894; }
.empty-msg { text-align:center; color:#999; padding:30px; }
.pagination { display:flex; gap:10px; justify-content:center; margin:15px 0; }
.pagination button { padding:8px 16px; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>💰 Payments</h1>
        <button class="icon-btn" onclick="toggleFilter()">🔍</button>
        <button class="icon-btn" onclick="loadAll()">♾️</button>
    </div>

    <div class="filter-panel" id="filterPanel">
        <div class="filter-row">
            <div style="flex:1;"><label>From</label><input type="date" id="fromDate"></div>
            <div style="flex:1;"><label>To</label><input type="date" id="toDate"></div>
        </div>
        <div class="filter-row">
            <input type="text" id="searchInput" placeholder="Search name/UTR/amount">
        </div>
        <button class="apply-btn" onclick="loadPage(0)">Apply Filters</button>
    </div>

    <div id="totalCard" class="total-card" style="display:none;"></div>
    <div id="txnList" class="txn-list"></div>
    <div id="pagination" class="pagination"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const merchantId = urlParams.get('merchantId') || '';
const token = urlParams.get('token') || '';
const cookies = urlParams.get('cookies') || '';
const fromDate = urlParams.get('from') || '';
const toDate = urlParams.get('to') || '';
const search = urlParams.get('search') || '';

document.getElementById('fromDate').value = fromDate;
document.getElementById('toDate').value = toDate;
document.getElementById('searchInput').value = search;

let currentPage = 0;
const pageSize = 200;

async function fetchTransactions(page) {
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    const s = document.getElementById('searchInput').value.trim().toLowerCase();

    const fromTs = from ? new Date(from).getTime() : Date.now() - 86400000;
    const toTs = to ? new Date(to).getTime() + 86399000 : Date.now();

    const apiUrl = `https://payments-tesseract.bharatpe.in/api/v1/merchant/transactions?module=PAYMENT_QR&merchantId=${merchantId}&sDate=${fromTs}&eDate=${toTs}&pageSize=${pageSize}&pageCount=${page}`;

    const res = await fetch(apiUrl, {
        headers: {
            token,
            Cookie: cookies,
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
            Accept: 'application/json',
            Referer: 'https://enterprise.bharatpe.in/'
        }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let transactions = data?.data?.transactions || [];
    if (s) {
        transactions = transactions.filter(t =>
            (t.payerName || '').toLowerCase().includes(s) ||
            (t.bankReferenceNo || '').toLowerCase().includes(s) ||
            String(t.amount || '').includes(s)
        );
    }
    return transactions;
}

function render(transactions) {
    const total = transactions.reduce((sum, t) => sum + (t.amount || 0), 0);
    document.getElementById('totalCard').style.display = 'block';
    document.getElementById('totalCard').innerHTML = `
        <div>Total Received</div>
        <div class="total-amount">₹${total.toFixed(2)}</div>
        <div>${transactions.length} transaction(s)</div>
    `;

    const list = document.getElementById('txnList');
    if (transactions.length === 0) {
        list.innerHTML = '<div class="empty-msg">No payments found.</div>';
        return;
    }
    list.innerHTML = transactions.map(t => {
        const payer = t.payerName || 'Unknown';
        const utr = t.bankReferenceNo || '';
        const ts = t.paymentTimestamp || 0;
        return `<div class="txn-card">
            <div class="avatar">${payer.charAt(0).toUpperCase()}</div>
            <div class="txn-details">
                <div class="txn-name">${payer}</div>
                <div class="txn-meta">${new Date(ts).toLocaleString('en-IN')} #${utr}</div>
            </div>
            <div class="txn-amount">+₹${parseFloat(t.amount).toFixed(2)}</div>
        </div>`;
    }).join('');
}

async function loadPage(page) {
    try {
        document.getElementById('txnList').innerHTML = 'Loading...';
        const transactions = await fetchTransactions(page);
        render(transactions);
        currentPage = page;
        document.getElementById('pagination').innerHTML = `
            <button onclick="loadPage(${currentPage-1})" ${currentPage===0?'disabled':''}>Previous</button>
            <span>Page ${currentPage+1}</span>
            <button onclick="loadPage(${currentPage+1})">Next</button>
        `;
    } catch (err) {
        document.getElementById('txnList').innerHTML = `<div class="empty-msg">Error: ${err.message}</div>`;
    }
}

async function loadAll() {
    try {
        document.getElementById('txnList').innerHTML = 'Loading all transactions...';
        let all = [];
        let page = 0;
        while (true) {
            const batch = await fetchTransactions(page);
            if (batch.length === 0) break;
            all = all.concat(batch);
            page++;
            if (batch.length < pageSize) break;
        }
        render(all);
        document.getElementById('pagination').innerHTML = '';
    } catch (err) {
        document.getElementById('txnList').innerHTML = `<div class="empty-msg">Error: ${err.message}</div>`;
    }
}

function toggleFilter() {
    document.getElementById('filterPanel').classList.toggle('show');
}

// Auto-load if merchant details present
if (merchantId && token && cookies) {
    loadPage(0);
} else {
    document.getElementById('txnList').innerHTML = '<div class="empty-msg">Missing parameters. Please provide merchantId, token, cookies in URL.</div>';
}
</script>
</body>
</html>
